plugins {
    id 'fabric-loom' version '1.1-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Ensure Java 17 is used for compilation
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Fabric Loom configuration
loom {
    // Configure access wideners for specific needs if any
    // accessWidenerPath = file("src/main/resources/mace_backport.accesswidener")
}

repositories {
    // Add repositories for any additional dependencies here
    mavenCentral()
}

dependencies {
    // Minecraft and Fabric API
    minecraft "com.mojang:minecraft:1.19.2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Add any other dependencies here
    // For example:
    // modImplementation "com.example:some-other-mod:1.0.0"
}

// Configure the jar to include fabric.mod.json and other resources
processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Ensure UTF-8 encoding for Java compilation
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
}

// Configure javadoc and sources jars for publishing
jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact(remapJar) {
                classifier "dev"
            }
            artifact(sourcesJar) {
                classifier "sources"
            }
            artifact(javadocJar) {
                classifier "javadoc"
            }
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories for publishing here
    }
}
